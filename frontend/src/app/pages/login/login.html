<div class="pantalla-centrada">
  <form class="tarjeta" (ngSubmit)="enviar()" novalidate>
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa con tu teléfono y la contraseña del ambiente.</p>

    @if (error()) {
      <div class="alerta-error">{{ error() }}</div>
    }

    <div class="campo">
      <label for="telefono">Teléfono móvil</label>
      <input id="telefono" name="telefono" type="tel" inputmode="tel" [(ngModel)]="telefono"
             autocomplete="tel" placeholder="Ej. 8888-8888">
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password">
    </div>

    <button class="boton" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>

    <p class="pie">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</div>
